<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一致性哈希环可视化</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>一致性哈希环可视化</h1>
    <div id="status" class="status"></div>
  </header>

  <section class="controls">
    <div class="control-group">
      <h2>节点</h2>
      <div class="row">
        <input id="node-input" type="text" placeholder="节点名，如 node-A">
        <button id="add-node">添加节点</button>
      </div>
      <div id="node-list" class="list"></div>
    </div>

    <div class="control-group">
      <h2>键（<span id="key-count-label">0</span>）</h2>
      <div class="row">
        <input id="key-input" type="text" placeholder="键名，如 user:1001">
        <button id="add-key">添加键</button>
      </div>
      <div class="row">
        <input id="batch-count" type="number" value="200" min="1" max="5000">
        <button id="add-keys-batch">批量添加随机键</button>
        <button id="clear-keys" class="ghost">清空键</button>
      </div>
      <div id="key-list" class="list tall"></div>
    </div>

    <div class="control-group">
      <h2>配置</h2>
      <div class="row">
        <label for="vnode-count">虚拟节点数</label>
        <input id="vnode-count" type="range" min="1" max="500" value="100">
        <span id="vnode-count-label" class="badge">100</span>
      </div>
      <div class="row">
        <button id="clear-all" class="ghost danger">清空全部</button>
      </div>
      <p class="hint">配置与数据自动持久化到 IndexedDB，刷新页面后自动恢复。</p>
    </div>
  </section>

  <section class="rings">
    <div class="ring-panel">
      <h2>无虚拟节点</h2>
      <canvas id="ring-plain" class="ring"></canvas>
      <canvas id="balance-plain" class="balance"></canvas>
      <div id="stats-plain" class="stats"></div>
    </div>
    <div class="ring-panel">
      <h2>虚拟节点模式</h2>
      <canvas id="ring-vnode" class="ring"></canvas>
      <canvas id="balance-vnode" class="balance"></canvas>
      <div id="stats-vnode" class="stats"></div>
    </div>
  </section>

  <section class="logs">
    <div class="log-panel">
      <h2>键迁移（最近一次拓扑变化）</h2>
      <div id="migration-log"></div>
    </div>
    <div class="log-panel">
      <h2>哈希冲突</h2>
      <div id="collision-log"></div>
    </div>
  </section>

  <div id="tooltip" class="tooltip"></div>

  <script src="js/hashring.js"></script>
  <script src="js/db.js"></script>
  <script src="js/viz.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
